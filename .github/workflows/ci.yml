name: CI/CD

on:
  push:
    branches:
      - master
      - develop

  pull_request:
    branches:
      - master
      - develop

  schedule:
    - cron: "17 6 * * 1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  SOLUTION_FILE: CorporateServiceDesk.sln
  BUILD_CONFIGURATION: Release
  MINIMUM_LINE_COVERAGE: 60
  MINIMUM_BRANCH_COVERAGE: 40
  DOCKER_IMAGE: ghcr.io/peterson-benhame/corporate-service-desk-api
  INFRASTRUCTURE_PROJECT: src/CorporateServiceDesk.Infrastructure/CorporateServiceDesk.Infrastructure.csproj
  STARTUP_PROJECT: src/CorporateServiceDesk.Api/CorporateServiceDesk.Api.csproj
  DB_CONTEXT: ApplicationDbContext
  SMOKE_NETWORK: corporate-service-desk-ci
  SMOKE_DB_CONTAINER: corporate-service-desk-postgres-ci
  SMOKE_API_CONTAINER: corporate-service-desk-api-ci
  SMOKE_DB_NAME: corporate_service_desk_ci
  SMOKE_DB_USER: postgres
  SMOKE_DB_PASSWORD: postgres_ci_password

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=corporate_service_desk_ci;Username=postgres;Password=postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_FILE }}" --locked-mode

      - name: Build solution
        run: dotnet build "${{ env.SOLUTION_FILE }}" --configuration "${{ env.BUILD_CONFIGURATION }}" --no-restore

      - name: Run tests with coverage
        run: |
          dotnet test "${{ env.SOLUTION_FILE }}" \
            --configuration "${{ env.BUILD_CONFIGURATION }}" \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory "${{ github.workspace }}/TestResults" \
            --logger "console;verbosity=normal"

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11

      - name: Generate coverage report
        run: |
          reportgenerator \
            "-reports:${{ github.workspace }}/TestResults/**/coverage.cobertura.xml" \
            "-targetdir:${{ github.workspace }}/CoverageReport" \
            "-reporttypes:Html;Cobertura;TextSummary" \
            "-filefilters:-*/Migrations/*"

      - name: Validate coverage thresholds
        shell: bash
        run: |
          python3 <<'PYTHON'
          import os
          import sys
          import xml.etree.ElementTree as ET

          report_path = os.path.join(os.environ["GITHUB_WORKSPACE"], "CoverageReport", "Cobertura.xml")
          root = ET.parse(report_path).getroot()

          line_coverage = float(root.attrib.get("line-rate", 0)) * 100
          branch_coverage = float(root.attrib.get("branch-rate", 0)) * 100
          minimum_line = float(os.environ["MINIMUM_LINE_COVERAGE"])
          minimum_branch = float(os.environ["MINIMUM_BRANCH_COVERAGE"])

          print(f"Line coverage: {line_coverage:.2f}%")
          print(f"Branch coverage: {branch_coverage:.2f}%")

          if line_coverage < minimum_line or branch_coverage < minimum_branch:
              sys.exit(1)
          PYTHON

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: CoverageReport
          if-no-files-found: error
          retention-days: 14

      - name: Validate pending model changes
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project "${{ env.INFRASTRUCTURE_PROJECT }}" \
            --startup-project "${{ env.STARTUP_PROJECT }}" \
            --context "${{ env.DB_CONTEXT }}" \
            --configuration "${{ env.BUILD_CONFIGURATION }}" \
            --no-build

  codeql:
    name: CodeQL
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          dependency-caching: true

      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_FILE }}" --locked-mode

      - name: Build solution for CodeQL
        run: dotnet build "${{ env.SOLUTION_FILE }}" --configuration "${{ env.BUILD_CONFIGURATION }}" --no-restore

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp

  repository-security:
    name: Repository Security
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: never

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-repository.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: .git,bin,obj,TestResults,CoverageReport
          exit-code: "0"

      - name: Upload repository scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-repository.sarif
          category: trivy-repository

      - name: Block committed secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          skip-dirs: .git,bin,obj,TestResults,CoverageReport
          exit-code: "1"

  container:
    name: Container Validation
    needs:
      - codeql
      - repository-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build production Docker image
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"

          docker build \
            --file "src/CorporateServiceDesk.Api/Dockerfile" \
            --build-arg BUILD_CONFIGURATION="${{ env.BUILD_CONFIGURATION }}" \
            --build-arg BUILD_REVISION="${GITHUB_SHA}" \
            --build-arg BUILD_VERSION="0.0.0-${SHORT_SHA}" \
            --tag "${DOCKER_IMAGE}:${GITHUB_SHA}" \
            .

      - name: Create smoke-test environment
        shell: bash
        run: |
          docker network create "${SMOKE_NETWORK}"

          docker run --detach \
            --name "${SMOKE_DB_CONTAINER}" \
            --network "${SMOKE_NETWORK}" \
            --env POSTGRES_DB="${SMOKE_DB_NAME}" \
            --env POSTGRES_USER="${SMOKE_DB_USER}" \
            --env POSTGRES_PASSWORD="${SMOKE_DB_PASSWORD}" \
            --health-cmd="pg_isready -U ${SMOKE_DB_USER} -d ${SMOKE_DB_NAME}" \
            --health-interval=2s \
            --health-timeout=3s \
            --health-retries=30 \
            postgres:16-alpine

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "${SMOKE_DB_CONTAINER}")

            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              docker logs "${SMOKE_DB_CONTAINER}"
              exit 1
            fi

            sleep 2
          done

          docker logs "${SMOKE_DB_CONTAINER}"
          exit 1

      - name: Start API container
        shell: bash
        run: |
          docker run --detach \
            --name "${SMOKE_API_CONTAINER}" \
            --network "${SMOKE_NETWORK}" \
            --publish 18080:8080 \
            --env ASPNETCORE_ENVIRONMENT=Production \
            --env ASPNETCORE_URLS=http://+:8080 \
            --env APP_VERSION="${GITHUB_SHA}" \
            --env "ConnectionStrings__DefaultConnection=Host=${SMOKE_DB_CONTAINER};Port=5432;Database=${SMOKE_DB_NAME};Username=${SMOKE_DB_USER};Password=${SMOKE_DB_PASSWORD}" \
            "${DOCKER_IMAGE}:${GITHUB_SHA}"

      - name: Validate API, migrations and version
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            VERSION_RESPONSE=$(curl --silent --fail http://localhost:18080/version || true)
            HEALTH_RESPONSE=$(curl --silent --fail http://localhost:18080/health || true)

            if echo "$VERSION_RESPONSE" | jq --exit-status --arg sha "$GITHUB_SHA" '.commit == $sha' >/dev/null 2>&1 && \
               echo "$HEALTH_RESPONSE" | jq --exit-status --arg sha "$GITHUB_SHA" '.statusApplication == "Healthy" and .commit == $sha' >/dev/null 2>&1; then
              MIGRATION_COUNT=$(docker exec "${SMOKE_DB_CONTAINER}" \
                psql \
                  --username "${SMOKE_DB_USER}" \
                  --dbname "${SMOKE_DB_NAME}" \
                  --tuples-only \
                  --no-align \
                  --command 'SELECT COUNT(*) FROM "__EFMigrationsHistory";' | xargs)

              if [[ "$MIGRATION_COUNT" =~ ^[1-9][0-9]*$ ]]; then
                exit 0
              fi
            fi

            sleep 5
          done

          docker logs "${SMOKE_API_CONTAINER}"
          exit 1

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-container.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload container scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-container.sarif
          category: trivy-container

      - name: Block critical container vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Cleanup smoke-test environment
        if: always()
        shell: bash
        run: |
          docker rm --force "${SMOKE_API_CONTAINER}" 2>/dev/null || true
          docker rm --force "${SMOKE_DB_CONTAINER}" 2>/dev/null || true
          docker network rm "${SMOKE_NETWORK}" 2>/dev/null || true

      - name: Save Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker save "${DOCKER_IMAGE}:${GITHUB_SHA}" | gzip > corporate-service-desk-image.tar.gz

      - name: Upload Docker image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: production-docker-image
          path: corporate-service-desk-image.tar.gz
          retention-days: 1

  publish:
    name: Publish GHCR
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: production-docker-image

      - name: Load Docker image
        run: docker load --input corporate-service-desk-image.tar.gz

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        shell: bash
        run: |
          docker push "${DOCKER_IMAGE}:${GITHUB_SHA}"
          docker tag "${DOCKER_IMAGE}:${GITHUB_SHA}" "${DOCKER_IMAGE}:latest"
          docker push "${DOCKER_IMAGE}:latest"

  deploy-production:
    name: Deploy Render
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: production
      url: https://corporateservicedesk.onrender.com

    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      PRODUCTION_URL: https://corporateservicedesk.onrender.com

    steps:
      - name: Validate Render deploy hook secret
        shell: bash
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"

      - name: Trigger exact commit deployment
        shell: bash
        run: |
          if [[ "$RENDER_DEPLOY_HOOK_URL" == *"?"* ]]; then
            DEPLOY_URL="${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"
          else
            DEPLOY_URL="${RENDER_DEPLOY_HOOK_URL}?ref=${GITHUB_SHA}"
          fi

          curl --fail --silent --show-error --request POST "$DEPLOY_URL"

      - name: Validate exact production version
        shell: bash
        run: |
          for attempt in $(seq 1 40); do
            VERSION_RESPONSE=$(curl --silent --fail "${PRODUCTION_URL}/version" || true)
            HEALTH_RESPONSE=$(curl --silent --fail "${PRODUCTION_URL}/health" || true)

            DEPLOYED_COMMIT=$(echo "$VERSION_RESPONSE" | jq --raw-output '.commit // empty' 2>/dev/null || true)
            HEALTH_STATUS=$(echo "$HEALTH_RESPONSE" | jq --raw-output '.statusApplication // empty' 2>/dev/null || true)
            HEALTH_COMMIT=$(echo "$HEALTH_RESPONSE" | jq --raw-output '.commit // empty' 2>/dev/null || true)

            if [ "$DEPLOYED_COMMIT" = "$GITHUB_SHA" ] && [ "$HEALTH_STATUS" = "Healthy" ] && [ "$HEALTH_COMMIT" = "$GITHUB_SHA" ]; then
              exit 0
            fi

            sleep 15
          done

          exit 1

  release:
    name: Release
    needs: deploy-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write

    steps:
      - name: Create or update release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout released version
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        if: steps.release.outputs.release_created == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish semantic Docker tags
        if: steps.release.outputs.release_created == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          REVISION=$(git rev-parse HEAD)
          MAJOR="${RELEASE_VERSION%%.*}"
          MINOR="${RELEASE_VERSION%.*}"

          docker build \
            --file src/CorporateServiceDesk.Api/Dockerfile \
            --build-arg BUILD_CONFIGURATION=Release \
            --build-arg BUILD_REVISION="${REVISION}" \
            --build-arg BUILD_VERSION="${RELEASE_VERSION}" \
            --tag "${DOCKER_IMAGE}:${RELEASE_TAG}" \
            --tag "${DOCKER_IMAGE}:${RELEASE_VERSION}" \
            --tag "${DOCKER_IMAGE}:${MINOR}" \
            --tag "${DOCKER_IMAGE}:${MAJOR}" \
            .

          docker push "${DOCKER_IMAGE}:${RELEASE_TAG}"
          docker push "${DOCKER_IMAGE}:${RELEASE_VERSION}"
          docker push "${DOCKER_IMAGE}:${MINOR}"
          docker push "${DOCKER_IMAGE}:${MAJOR}"
