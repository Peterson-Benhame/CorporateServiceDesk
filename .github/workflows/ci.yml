name: CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CorporateServiceDesk.sln

      - name: Build
        run: dotnet build CorporateServiceDesk.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CorporateServiceDesk.sln --configuration Release --no-build